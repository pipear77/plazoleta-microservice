server:
  port: 8080
spring:
  application:
    name: "plazoleta-microservice"
  datasource:
    url: "jdbc:postgresql://localhost:5434/plazoleta_db"
    username: "postgres"
    password: "postgres"
    driverClassName: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "update"
    show-sql: true
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true